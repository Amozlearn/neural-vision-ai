name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check index.html
        run: |
          if [ ! -f app/src/main/assets/index.html ]; then
            echo "::error::index.html not found - upload NeuralVisionAI.html content to app/src/main/assets/index.html"
            exit 1
          fi

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/ai/neuralvision/app
          mkdir -p app/src/main/res/values app/src/main/res/drawable

          cat > gradle.properties <<'P1'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          P1

          cat > settings.gradle <<'P2'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NeuralVisionAI"
          include ':app'
          P2

          cat > build.gradle <<'P3'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          P3

          cat > app/build.gradle <<'P4'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ai.neuralvision.app'
              compileSdk 34

              defaultConfig {
                  applicationId "ai.neuralvision.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "4.2"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          P4

          cat > app/src/main/AndroidManifest.xml <<'P5'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>

              <application
                  android:label="Neural Vision AI"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@style/Theme.NVA"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          P5

          cat > app/src/main/java/ai/neuralvision/app/MainActivity.java <<'P6'
          package ai.neuralvision.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private PermissionRequest pendingCam;

              private final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.parseColor("#04070d"));
                  getWindow().setNavigationBarColor(Color.parseColor("#04070d"));

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#04070d"));
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setTextZoom(100);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest req) {
                          return assetLoader.shouldInterceptRequest(req.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest req) {
                          boolean ok = "appassets.androidplatform.net".equals(req.getUrl().getHost());
                          if (!ok) {
                              try { startActivity(new Intent(Intent.ACTION_VIEW, req.getUrl())); } catch (Exception ignored) {}
                          }
                          return !ok;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest req) {
                          boolean hasVideo = false;
                          for (String r : req.getResources()) {
                              if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r)) { hasVideo = true; break; }
                          }
                          if (!hasVideo) { req.deny(); return; }
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                                      req.grant(req.getResources());
                                  } else {
                                      pendingCam = req;
                                      requestPermissions(new String[]{Manifest.permission.CAMERA}, 42);
                                  }
                              }
                          });
                      }

                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          try { startActivityForResult(p.createIntent(), 7); return true; }
                          catch (Exception e) { filePathCallback = null; return false; }
                      }
                  });

                  if (savedInstanceState != null) webView.restoreState(savedInstanceState);
                  else webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(code, perms, res);
                  if (code == 42 && pendingCam != null) {
                      if (res.length > 0 && res[0] == PackageManager.PERMISSION_GRANTED)
                          pendingCam.grant(pendingCam.getResources());
                      else
                          pendingCam.deny();
                      pendingCam = null;
                  }
              }

              @Override
              protected void onActivityResult(int code, int res, Intent data) {
                  if (code == 7) {
                      Uri[] uris = WebChromeClient.FileChooserParams.parseResult(res, data);
                      if (filePathCallback != null) filePathCallback.onReceiveValue(uris != null ? uris : new Uri[0]);
                      filePathCallback = null;
                  } else {
                      super.onActivityResult(code, res, data);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack(); else finish();
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  webView.saveState(out);
              }

              @Override
              protected void onDestroy() {
                  webView.destroy();
                  super.onDestroy();
              }
          }
          P6

          cat > app/src/main/res/values/themes.xml <<'P7'
          <resources>
              <style name="Theme.NVA" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#04070d</item>
                  <item name="android:statusBarColor">#04070d</item>
                  <item name="android:navigationBarColor">#04070d</item>
              </style>
          </resources>
          P7

          cat > app/src/main/res/drawable/ic_launcher.xml <<'P8'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path android:fillColor="#04070D" android:pathData="M0,0h108v108h-108z"/>

              <path
                  android:strokeColor="#00E5FF"
                  android:strokeWidth="4.5"
                  android:pathData="M13,33 L13,13 L33,13 M75,13 L95,13 L95,33 M95,75 L95,95 L75,95 M33,95 L13,95 L13,75"/>

              <path android:fillColor="#00E5FF" android:fillAlpha="0.85" android:pathData="
                  M42.8,45a2.2,2.2 0 1,0 4.4,0a2.2,2.2 0 1,0 -4.4,0
                  M60.8,45a2.2,2.2 0 1,0 4.4,0a2.2,2.2 0 1,0 -4.4,0
                  M42.8,63a2.2,2.2 0 1,0 4.4,0a2.2,2.2 0 1,0 -4.4,0
                  M60.8,63a2.2,2.2 0 1,0 4.4,0a2.2,2.2 0 1,0 -4.4,0"/>

              <path android:fillColor="#A970FF" android:pathData="
                  M51.8,54a2.2,2.2 0 1,0 4.4,0a2.2,2.2 0 1,0 -4.4,0"/>
          </vector>
          P8

          echo "== project generated =="

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NVA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
